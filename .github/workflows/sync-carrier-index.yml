name: Sync carrier index

on:
  schedule:
    # Wednesdays at 13:00 UTC — one hour after FMCSA's weekly census refresh.
    - cron: '0 13 * * 3'
  workflow_dispatch:

concurrency:
  group: carrier-index-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - id: config
        env:
          INDEX_DB: ${{ secrets.CARRIER_INDEX_DATABASE_URL_UNPOOLED }}
          DOT_TOKEN: ${{ secrets.DOT_APP_TOKEN }}
        run: |
          if [ -z "$INDEX_DB" ] || [ -z "$DOT_TOKEN" ]; then
            echo "::warning::Repository secrets CARRIER_INDEX_DATABASE_URL_UNPOOLED and/or DOT_APP_TOKEN are not set. Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Full sync of active carriers
        if: steps.config.outputs.ready == 'true'
        run: node scripts/sync-carrier-index.mjs
        env:
          CARRIER_INDEX_DATABASE_URL_UNPOOLED: ${{ secrets.CARRIER_INDEX_DATABASE_URL_UNPOOLED }}
          DOT_APP_TOKEN: ${{ secrets.DOT_APP_TOKEN }}
